# CI: build, code generation, static checks and tests (AGENTS.md §4, ROADMAP.md M0-10).
#
# The order has a hard reason: the frontend artifacts (frontend/dist) are the input to go:embed, so
# `npm run build` must run before compiling Go, otherwise embedding fails outright.
#
# Tests run SQLite only (AGENTS.md §2.5): CI starts no database service, and the PostgreSQL cases gated by
# internal/pgtest skip themselves here and print the reason. To cover the production PG driver, set TEST_PG_DSN
# locally and run those three packages by hand.
#
# The triggers are pull_request and workflow_dispatch only, **no push**: main is pushed directly by the maintainer,
# who has already run the full §4 check suite locally before pushing, so running it again on every push is pure repetition.
# When an independent review is needed (frontend artifacts, go.mod / go.sum touched, or before a release), trigger the ref by hand with workflow_dispatch.
#
# Repository sanitization (AGENTS.md §2.2): this file may only contain example.com / localhost / CHANGE_ME.
name: ci

on:
  pull_request:
  workflow_dispatch:

# Least privilege: CI only reads repository contents.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build and test
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # The version comes from the value declared in go.mod (currently 1.27): that is this repository's compatibility floor, and it saves manual syncing.
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Node.js environment and cache: pinned to package-lock.json, supporting the SPA build
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      # The npm version comes from packageManager in frontend/package.json; the npm bundled with the
      # image/runner is older, so install the declared one explicitly and keep lockfile writes consistent.
      - name: Pin npm
        run: npm install -g npm@12.2.1

      - name: Show tool versions
        run: |
          go version
          node --version
          npm --version

      # Frontend build precedes Go compilation: artifacts land in frontend/dist and are embedded into the binary by go:embed all:dist
      - name: Frontend check, test, and build
        run: |
          set -euo pipefail
          cd frontend
          npm ci
          npm run check
          npm test -- --run
          npm run test:client
          npm run build

      - name: Check formatting (gofmt)
        run: |
          fmt_out="$(gofmt -l .)"
          if [ -n "$fmt_out" ]; then
            echo "$fmt_out"
            echo "gofmt: the files above are not formatted"
            exit 1
          fi

      - name: Build
        run: go build ./...

      - name: Vet
        run: go vet ./...

      # Vulnerability gate: only "reachable" vulnerabilities count as failures. govulncheck reports only vulnerabilities
      # reachable from call paths by default and exits with code 3 on a hit; vulnerabilities present in dependencies but never
      # called do not block the build, avoiding false-positive noise. The version is pinned so CI conclusions do not drift with the tool version (verified locally with v1.8.0).
      - name: Vulnerability check (govulncheck, reachable only)
        run: |
          set -euo pipefail
          go install golang.org/x/vuln/cmd/govulncheck@v1.8.0
          govulncheck ./...

      # Platform-specific code is only exposed by cross-compiling: the runner is Linux, so internal/jobs' process_windows.go
      # does not even take part in a native build and a mistake there stays green (M0-14). vet type-checks test files too,
      # so whether a unix-only test file leaks onto other platforms is caught here as well.
      - name: Cross-compile and vet for Windows
        run: |
          set -euo pipefail
          for arch in amd64 arm64; do
            GOOS=windows GOARCH="$arch" CGO_ENABLED=0 go build -o /dev/null ./cmd/engram
            GOOS=windows GOARCH="$arch" go vet ./...
          done

      # Language pack completeness: the zh/en keys must correspond one to one, and a single missing one fails the job.
      - name: i18n language-pack parity
        run: go test ./internal/i18n/...

      # Full test run; no TEST_PG_DSN is set, so the PostgreSQL cases skip themselves (see the file header).
      - name: Test
        run: go test ./...
