# 镜像构建与发布：把 Dockerfile（ROADMAP.md M0-11）的多阶段产物推到 Docker Hub 的
# nite07/engram。ci.yml 只做校验、不产出制品，本文件补上制品那一半。
#
# 触发只有两种，都不含 push(main)：main 由维护者直推，中间提交没有发布价值，镜像只在
# 一个明确的版本点上产出。推一个 v* 标签即发布该版本并同步 :latest；要补发、重发或
# 试发时用 workflow_dispatch，可指定版本号，留空则发 :edge。
#
# 构建方式有一条实测出来的原因：本仓库的 runner 是 act，job 容器经宿主的 rootless podman
# socket 使用 buildx 的 docker-container 驱动（实测 buildkitd v0.33.1，声明的平台只有
# amd64 系列与 386）。该驱动默认把构建结果只留在 build cache 里——构建日志末尾那句
# "No output specified with docker-container driver" 就是这个意思——本地镜像库里什么都不落，
# 随后的 push 无从推起，要落地必须显式 --load（本地）或 --push（直接推仓库）。这里改用
# DOCKER_BUILDKIT=0 的经典构建器：它把镜像直接 tag 进本地镜像库，与下面的 docker push
# 配合最直白。改用 buildx 时别忘补 --push。
# Dockerfile 自带的 VERSION 参数用来写入二进制版本，这里传发布版本号。
#
# 需要的仓库 secret：DOCKERHUB_USERNAME、DOCKERHUB_TOKEN（仓库 Settings → Actions → Secrets）。
#
# 仓库脱敏（AGENTS.md §2.2）：本文件只允许出现 example.com / localhost / CHANGE_ME 与已登记
# 的模块路径域，由 scripts/checks/no-private-data.sh 自检。
name: image

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Image tag to publish (empty publishes :edge)'
        required: false
        default: ''

# 只读仓库内容：发布凭据取自仓库 secret，与这条权限无关。
permissions:
  contents: read

jobs:
  publish:
    name: build and push image
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4

      # 版本号先解析再落到 $GITHUB_ENV，供后续步骤共用；只依赖 GITHUB_REF（act 恒有），
      # 不去赌 GITHUB_REF_TYPE / GITHUB_REF_NAME 是否存在。
      # dispatch 的输入经 env 传入，不直接插值进 shell。
      - name: Resolve the version to publish
        env:
          DISPATCH_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          ref="${GITHUB_REF:-}"
          if [ "${ref#refs/tags/}" != "${ref}" ]; then
            version="${ref#refs/tags/}"
          else
            version="${DISPATCH_VERSION:-edge}"
          fi
          echo "IMAGE_TAG=${version}" >> "$GITHUB_ENV"
          echo "publishing nite07/engram:${version} and :latest"

      - name: Log in to Docker Hub
        run: |
          set -euo pipefail
          echo "${{ secrets.DOCKERHUB_TOKEN }}" \
            | docker login -u "${{ secrets.DOCKERHUB_USERNAME }}" --password-stdin

      - name: Build and push
        run: |
          set -euo pipefail
          image=nite07/engram
          DOCKER_BUILDKIT=0 docker build \
            --build-arg "VERSION=${IMAGE_TAG}" \
            -t "${image}:${IMAGE_TAG}" \
            -t "${image}:latest" \
            .
          docker push "${image}:${IMAGE_TAG}"
          docker push "${image}:latest"
