# 发布流水线：推 v* 标签时，由 GoReleaser 产出 GitHub Release —— 二进制、Rust 优化器
# 适配器与多架构容器镜像（配置见 .goreleaser.yaml，ROADMAP.md M0-14）。
#
# 为什么跑在 GitHub Actions 而不是 Gitea 侧的自建 runner：镜像要 linux/amd64 与
# linux/arm64 两份，需要真正的 buildx + QEMU；自建 runner 上没有这套多架构构建能力。
# GitHub 托管 runner 自带，且可以在这个仓库上用内置的 GITHUB_TOKEN 直接发布，
# 不必为此新增一个 token 类 secret。
#
# 需要的仓库 secret（配在 GitHub 的 bestnite/engram 上）：
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN —— 推 Docker Hub 的 nite07/engram 用。
# 推 ghcr.io/bestnite/engram 走内置 GITHUB_TOKEN，无需配置。
#
# 发布目标是 GitHub 的 bestnite/engram；.goreleaser.yaml 里显式写了 owner/name，
# 不受本仓库的 origin 影响。
#
# 仓库脱敏（AGENTS.md §2.2）：本文件只允许出现 example.com / localhost / CHANGE_ME。
name: release

# 只认标签：一条流水线对应一个发布版本。历史运行可以用 GitHub 的 Re-run（沿用原 ref）重跑，
# 因此不提供 workflow_dispatch —— 手动触发的 ref 往往不是标签，GORELEASER_CURRENT_TAG 会落到
# 一个非发布版本上，反而制造出难以辨别的制品。
on:
  push:
    tags:
      - "v*"

# contents: 写 Release；packages: 推 ghcr.io。
permissions:
  contents: write
  packages: write

# 同一版本的发布不允许并发：两次 goreleaser 同时写 Release 会互相覆盖。
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # 适配器是 Rust 产物，不是 Go 构建产物，GoReleaser 编不出来，所以先在各目标平台上编译。
  # Linux 目标用 musl 静态链接（见下方 Build 步骤与 Dockerfile.release 的运行阶段）：发布镜像基于
  # alpine（musl），glibc 动态产物进不去；归档也要能在 musl 主机上直接跑。仍按目标架构原生编译
  # （runner 架构与产物架构一致），只是在 Linux runner 上多装一个 musl target、用 rust-lld 自链，
  # 不需要 C 交叉工具链。macOS/windows 保持原生编译，windows/arm64 因此没有产物，
  # .goreleaser.yaml 也把该目标排除了。
  optimizer:
    name: optimizer (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # rust_target 非空 = 该目标产出静态 musl 二进制（仅 Linux）。macOS/windows 留空，走原生编译。
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            rust_target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: ""
            rust_target: aarch64-unknown-linux-musl
          - runner: macos-14
            goos: darwin
            goarch: arm64
            ext: ""
            rust_target: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            rust_target: ""

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build the optimizer adapter
        shell: bash
        run: |
          set -euo pipefail
          # Linux 目标（rust_target 非空）必须产出静态 musl 二进制：发布镜像的运行阶段是 alpine
          # （musl），归档也要能在 musl 主机上直接跑。glibc 动态链接产物进 alpine 会因缺动态链接器
          # 报 "No such file or directory"（Dockerfile 的 optimizer 阶段同理，那里用 rust:1-alpine）。
          # rust-lld 是 rustc 自带的自包含链接器，不需要 C 交叉工具链：依赖树里没有需要 cc 编译的
          # C 代码（iana-time-zone-haiku 只用于 Haiku 目标）。
          rust_target="${{ matrix.rust_target }}"
          if [ -n "$rust_target" ]; then
            rustup target add "$rust_target"
            RUSTFLAGS="-C linker=rust-lld" \
              cargo build --release --manifest-path tools/optimizer/Cargo.toml --target "$rust_target"
            bin="tools/optimizer/target/$rust_target/release/optimizer"
            # 静态链接断言：动态产物进 alpine 会缺 loader（本次修复的缺陷），必须静态。
            # musl + crt-static 的 file 输出是 "static-pie linked" 或 "statically linked"。
            file "$bin" | grep -Eq 'statically linked|static-pie linked' \
              || { echo "error: $bin is not statically linked" >&2; exit 1; }
            # 构建期自证：产物在 Linux 构建机上必须能启动（与 Dockerfile 构建期的 --version 同一用意）。
            "$bin" --version
          else
            cargo build --release --manifest-path tools/optimizer/Cargo.toml
            bin="tools/optimizer/target/release/optimizer${{ matrix.ext }}"
          fi
          out="tools/optimizer/dist/${{ matrix.goos }}/${{ matrix.goarch }}"
          mkdir -p "$out"
          cp "$bin" "$out/"

      # 以 tools/optimizer/dist 为根部上传：制品内的路径就是 <os>/<arch>/optimizer[.exe]，
      # release 作业用 merge-multiple 下载后自动还原成 .goreleaser.yaml 约定的目录结构。
      - name: Upload the adapter
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tools/optimizer/dist
          if-no-files-found: error

  release:
    name: goreleaser
    needs: optimizer
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # 变更日志由提交历史生成，浅克隆会得到空的 release notes。
          fetch-depth: 0

      # 版本取 go.mod 声明的值，与 ci.yml 同一口径（本仓库的兼容下限）。
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Node.js 环境与缓存：供 .goreleaser.yaml before hook 执行前端生产构建
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch the optimizer adapters
        uses: actions/download-artifact@v4
        with:
          pattern: optimizer-*
          merge-multiple: true
          path: tools/optimizer/dist

      # 多架构镜像要 QEMU 跑 arm64 的 RUN 步骤，要 buildx 才能出 manifest list；
      # 托管 runner 的默认 builder 只支持单平台。两者都必须在 goreleaser 之前就位。
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # goreleaser 的 dockers_v2 只执行 docker buildx build --push，自身不登录任何 registry
      # （上游 internal/pipe/docker/v2/docker.go 已核对），凭据必须由本 workflow 先注入。
      # 缺了这一步 buildx 会以匿名身份推 ghcr，token 端点对匿名 push 一律 403 Forbidden，
      # 而且 goreleaser 把 "failed to fetch" 判为可重试，会白烧 10 次退避重试（约 25 分钟）。
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub 的凭据来自仓库 secret（见文件头）。两个 registry 都必须在 Release 之前登录。
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          # 与 Dockerfile / ci.yml 里的工具版本同一原则：钉死版本，升级时一起动。
          version: v2.18.2
          args: release --clean
        env:
          # 值全部来自仓库 secret（脱敏扫描把 ${{ ... }} 视作占位写法）。
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
