# Release pipeline: on pushing a v* tag, GoReleaser produces the GitHub Release — the binaries, the Rust optimizer
# adapter and the multi-architecture container images (configuration in .goreleaser.yaml, ROADMAP.md M0-14).
#
# Why it runs on GitHub Actions rather than a self-hosted runner on the Gitea side: the images need both linux/amd64 and
# linux/arm64, which requires real buildx + QEMU; the self-hosted runner has no such multi-arch build capability.
# GitHub-hosted runners have it built in, and can publish from this repository directly with the built-in GITHUB_TOKEN,
# so no extra token-type secret is needed for it.
#
# Required repository secrets (configured on bestnite/engram in GitHub):
#   DOCKERHUB_USERNAME / DOCKERHUB_TOKEN — used to push nite07/engram to Docker Hub.
# Pushing ghcr.io/bestnite/engram uses the built-in GITHUB_TOKEN and needs no configuration.
#
# The release target is bestnite/engram on GitHub; .goreleaser.yaml spells out owner/name explicitly,
# so it is unaffected by this repository's origin.
#
# Repository sanitization (AGENTS.md §2.2): this file may only contain example.com / localhost / CHANGE_ME.
name: release

# Tags only: one pipeline corresponds to one release version. Historical runs can be re-run with GitHub's Re-run (which reuses the original ref),
# which is why workflow_dispatch is not offered — a manually triggered ref is often not a tag, GORELEASER_CURRENT_TAG would land on
# a non-release version, and that just manufactures hard-to-identify artifacts.
on:
  push:
    tags:
      - "v*"

# contents: write the Release; packages: push to ghcr.io.
permissions:
  contents: write
  packages: write

# Releases of the same version must not run concurrently: two goreleaser runs writing the Release at once overwrite each other.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The adapter is a Rust artifact, not a Go build artifact, so GoReleaser cannot build it; it is therefore compiled on each target platform first.
  # Linux targets use static musl linking (see the Build step below and the runtime stage of Dockerfile.release): the release images are based on
  # alpine (musl), which glibc dynamic artifacts cannot enter; the archives must also run directly on musl hosts. It is still a native build per target
  # architecture (runner architecture matches artifact architecture), except that Linux runners install an extra musl target and self-link with rust-lld,
  # so no C cross toolchain is needed. macOS/windows keep native builds, so windows/arm64 has no artifact and
  # .goreleaser.yaml excludes that target as well.
  optimizer:
    name: optimizer (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          # A non-empty rust_target = this target produces a static musl binary (Linux only). macOS/windows leave it empty and build natively.
          - runner: ubuntu-latest
            goos: linux
            goarch: amd64
            ext: ""
            rust_target: x86_64-unknown-linux-musl
          - runner: ubuntu-24.04-arm
            goos: linux
            goarch: arm64
            ext: ""
            rust_target: aarch64-unknown-linux-musl
          - runner: macos-14
            goos: darwin
            goarch: arm64
            ext: ""
            rust_target: ""
          - runner: windows-latest
            goos: windows
            goarch: amd64
            ext: .exe
            rust_target: ""

    steps:
      - name: Check out
        uses: actions/checkout@v4

      - name: Build the optimizer adapter
        shell: bash
        run: |
          set -euo pipefail
          # Linux targets (non-empty rust_target) must produce a static musl binary: the release image's runtime stage is alpine
          # (musl), and the archives must also run directly on musl hosts. A glibc dynamically linked artifact entering alpine reports
          # "No such file or directory" for the missing dynamic loader (same for the Dockerfile's optimizer stage, which uses rust:1-alpine).
          # rust-lld is the self-contained linker bundled with rustc and needs no C cross toolchain: the dependency tree has no C
          # code requiring cc (iana-time-zone-haiku is only used for the Haiku target).
          rust_target="${{ matrix.rust_target }}"
          if [ -n "$rust_target" ]; then
            rustup target add "$rust_target"
            RUSTFLAGS="-C linker=rust-lld" \
              cargo build --release --manifest-path tools/optimizer/Cargo.toml --target "$rust_target"
            bin="tools/optimizer/target/$rust_target/release/optimizer"
            # Static linking assertion: a dynamic artifact entering alpine would lack the loader (the defect fixed this time), so it must be static.
            # With musl + crt-static, file reports "static-pie linked" or "statically linked".
            file "$bin" | grep -Eq 'statically linked|static-pie linked' \
              || { echo "error: $bin is not statically linked" >&2; exit 1; }
            # Self-proof at build time: the artifact must be able to start on the Linux build machine (same intent as the --version check at Dockerfile build time).
            "$bin" --version
          else
            cargo build --release --manifest-path tools/optimizer/Cargo.toml
            bin="tools/optimizer/target/release/optimizer${{ matrix.ext }}"
          fi
          out="tools/optimizer/dist/${{ matrix.goos }}/${{ matrix.goarch }}"
          mkdir -p "$out"
          cp "$bin" "$out/"

      # Uploaded with tools/optimizer/dist as the root: paths inside the artifact are already <os>/<arch>/optimizer[.exe],
      # and the release job downloads it with merge-multiple to restore the directory structure .goreleaser.yaml expects.
      - name: Upload the adapter
        uses: actions/upload-artifact@v4
        with:
          name: optimizer-${{ matrix.goos }}-${{ matrix.goarch }}
          path: tools/optimizer/dist
          if-no-files-found: error

  release:
    name: goreleaser
    needs: optimizer
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v4
        with:
          # The changelog is generated from commit history; a shallow clone yields empty release notes.
          fetch-depth: 0

      # The version comes from the value declared in go.mod, the same basis as ci.yml (this repository's compatibility floor).
      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Node.js environment and cache: for .goreleaser.yaml's before hook to run the frontend production build
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Fetch the optimizer adapters
        uses: actions/download-artifact@v4
        with:
          pattern: optimizer-*
          merge-multiple: true
          path: tools/optimizer/dist

      # Multi-arch images need QEMU to run the arm64 RUN steps and buildx to produce a manifest list;
      # the hosted runner's default builder supports a single platform only. Both must be in place before goreleaser runs.
      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      # goreleaser's dockers_v2 only runs docker buildx build --push and logs into no registry itself
      # (upstream internal/pipe/docker/v2/docker.go has been checked), so the credentials must be injected by this workflow first.
      # Without this step buildx pushes to ghcr anonymously, the token endpoint answers 403 Forbidden to every anonymous push,
      # and goreleaser treats "failed to fetch" as retryable, burning 10 backoff retries for nothing (about 25 minutes).
      - name: Log in to the GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Docker Hub credentials come from repository secrets (see the file header). Both registries must be logged into before the Release.
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Release
        uses: goreleaser/goreleaser-action@v6
        with:
          # The same principle as the tool versions in the Dockerfile / ci.yml: pin the version and move them together on upgrade.
          version: v2.18.2
          args: release --clean
        env:
          # All values come from repository secrets (the sanitization scan treats ${{ ... }} as placeholder syntax).
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
          DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}
