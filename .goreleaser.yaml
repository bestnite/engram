# GoReleaser configuration: on pushing a v* tag, publish the binaries, the Rust optimizer adapter and the container images to
# bestnite/engram (ROADMAP.md M0-14); invoked by .github/workflows/release.yml.
#
# Two pieces of background must be known first, otherwise you will change the wrong thing:
#   1. The Rust optimizer adapter is not a Go build artifact; this file attaches it via archives.files and dockers_v2.extra_files.
#      The files are compiled natively on each target platform by release.yml's optimizer job and laid out at
#      tools/optimizer/dist/<os>/<arch>/optimizer[.exe] (the convention is described in that workflow's comments).
#      It does not use builds' builder: prebuilt — that is GoReleaser Pro only, and the OSS version does not even have the field.
#   2. dockers_v2 hands docker a temporary context, not the repository root: Go binaries are laid out as <os>/<arch>/<name>
#      (which is why Dockerfile.release fetches them with $TARGETPLATFORM), and extra_files land unchanged at their relative
#      paths inside it. That is why the release image's Dockerfile is Dockerfile.release, not the Dockerfile that builds from source.
#
# Required repository secrets: DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (for pushing to Docker Hub; ghcr.io uses the
# workflow's built-in GITHUB_TOKEN). Both are configured on bestnite/engram in GitHub — releases run on
# GitHub Actions, and the self-hosted runner on the Gitea side has no multi-arch capability (reasoning in release.yml).
#
# Repository sanitization (AGENTS.md §2.2): the only host names in this file are the registered github.com and the image reference
# ghcr.io (without a scheme; the scan only looks for http(s):// URLs).
version: 2

project_name: engram

# The frontend artifacts (frontend/dist) are gitignored build output and must be built once before the multi-platform cross-compile so
# go:embed can embed them; without them the Go build fails outright (AGENTS.md §4).
before:
  hooks:
    - npm --prefix frontend ci
    - npm --prefix frontend run build

builds:
  - id: engram
    main: ./cmd/engram
    binary: engram
    env:
      - CGO_ENABLED=0
    flags:
      - -trimpath
    # Kept consistent with the Dockerfile's VERSION build argument: inject the raw v-prefixed tag rather than .Version
    # (the latter has its prefix stripped by goreleaser, which would make `engram version` differ between the two build paths).
    ldflags:
      - -s -w -X main.version={{ .Tag }}
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    # windows/arm64 is not released: the adapter has no trustworthy build path for that target (release.yml compiles only amd64
    # natively on the windows runner), so releasing it would produce an archive "with the main program but without the adapter".
    ignore:
      - goos: windows
        goarch: arm64
      - goos: darwin
        goarch: amd64

archives:
  - id: default
    ids:
      - engram
    formats:
      - tar.gz
    # windows gets a zip: unpack and double-click to run, no tar needed first.
    format_overrides:
      - goos: windows
        formats:
          - zip
    files:
      - LICENSE
      - README.md
      - README.zh.md
      # The adapter and the main program are packed into one archive, unpacking to "one service binary + one adapter"; the adapter must sit
      # next to the main program (internal/jobs looks for optimizer in the service binary's directory by default), and both are at the archive root.
      # strip_parent is the key: source paths are laid out by platform directory (<os>/<arch>/optimizer[.exe]), and without this option
      # the archive would keep the intermediate tools/optimizer/dist/<os>/<arch>/ directories, so after unpacking the adapter would not be
      # next to the binary; strip_parent takes only the base name, and windows' .exe comes along in the file name itself.
      - src: tools/optimizer/dist/{{ .Os }}/{{ .Arch }}/optimizer{{ if eq .Os "windows" }}.exe{{ end }}
        strip_parent: true

checksum:
  name_template: checksums.txt

dockers_v2:
  - id: engram
    ids:
      - engram
    images:
      - ghcr.io/bestnite/engram
      - nite07/engram
    tags:
      - "{{ .Tag }}"
      # Prereleases (v0.1.0-rc1 and the like) leave :latest alone, so a candidate version is never promoted to the default version.
      - "{{ if not .Prerelease }}latest{{ end }}"
    platforms:
      - linux/amd64
      - linux/arm64
    dockerfile: Dockerfile.release
    # The adapter does not go into builds (it is a Rust artifact) and enters the context via extra_files; both paths keep their
    # original shape inside the context, and Dockerfile.release picks the matching one with $TARGETPLATFORM.
    extra_files:
      - tools/optimizer/dist/linux/amd64/optimizer
      - tools/optimizer/dist/linux/arm64/optimizer
    labels:
      org.opencontainers.image.title: engram
      org.opencontainers.image.description: Self-hosted spaced-repetition service
      org.opencontainers.image.source: https://github.com/bestnite/engram
      org.opencontainers.image.licenses: AGPL-3.0-only

changelog:
  sort: asc
  # Seven characters identify a commit unambiguously in a repository this size; the default prints all 40,
  # which makes every bullet in a release body unreadable.
  abbrev: 7
  filters:
    # Only user-perceptible changes are worth the release notes; repository housekeeping (docs, tests, CI)
    # and merge commits stay in the git log.
    #
    # The pattern matches the subject both with and without a scope (`docs: subject` and `docs(scope): subject`),
    # because almost every subject in this repository carries a scope and a bare `^docs:` therefore matched nothing.
    #
    # `chore` is deliberately not excluded: dependency and toolchain bumps are committed as `chore(deps)`, and a
    # from-source builder has to know about those. They land under "Other changes" instead of disappearing.
    exclude:
      - "^(docs|test|ci)(\\(|:)"
      # Two merge styles reach the log here: `merge: <summary>` commits and `Merge branch '<branch>'` commits.
      - "^(merge|Merge)(:| |\\(|$)"
  groups:
    - title: Features
      regexp: "^feat(\\(|:)"
      order: 0
    - title: Bug fixes
      regexp: "^fix(\\(|:)"
      order: 1
    - title: Performance
      regexp: "^perf(\\(|:)"
      order: 2
    - title: Refactors
      regexp: "^refactor(\\(|:)"
      order: 3
    - title: Build and dependencies
      regexp: "^(build|chore)\\((deps|ci|build)\\)"
      order: 4
    - title: Other changes
      regexp: ".*"
      order: 9

release:
  github:
    # Ownership stated explicitly: the Gitea side is nite/engram, the release target is bestnite/engram on GitHub.
    owner: bestnite
    name: engram
  draft: false
  prerelease: auto
