[package]
name = "optimizer"
version = "0.1.0"
edition = "2021"
description = "FSRS parameter optimiser adapter for the engram service (AGENTS.md M9-2)"
publish = false

[[bin]]
name = "optimizer"
path = "src/main.rs"

[dependencies]
# The upstream crate name is fsrs (the repository is fsrs-rs); the optimizer entry point fsrs::compute_parameters is available in this version.
# Version pinned exactly: weights are persisted data and can only be reproduced by the same version of the training implementation (the README records the rationale).
fsrs = "=6.6.2"
chrono = "0.4"
chrono-tz = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
